name: Terraform sources

on:
  push:
    branches: [ "*" ]
    paths:
      - 'infra/**'
  pull_request:
    branches: [ "*" ]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_project_source: "${{ github.workspace }}"
  TF_VAR_environment: "staging"
  TF_VAR_confluence_host: "${{ secrets.confluence_host }}"
  TF_VAR_confluence_email: "${{ secrets.confluence_email }}"
  TF_VAR_confluence_token: "${{ secrets.confluence_token }}"

jobs:
  config-test:
    name: Configuration testing
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        working-directory: infra/

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Add the SSH key to the ssh-agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Terraform init
        id: init
        run: terraform init

      - name: Terraform formatting check
        id: fmt
        run: terraform fmt -check

      - name: Terraform Validate
        id: validate
        run: terraform validate
        continue-on-error: false

      - name: Terraform plan
        id: plan
        if: success()
        continue-on-error: false
        run: terraform plan -no-color -input=false

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && success()
        with:
          script: |
            const output = `## Infrastructure updates
            #### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details>
            <summary>Show infrastructure changes plan</summary>

            \`\`\`\n
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Author: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
